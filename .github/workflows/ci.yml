name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Start Docker Compose
        run: docker compose up -d
        env:
          SIMULATOR_DISABLE_LOOP: 'true'

      - name: Wait for pipeline simulator endpoint
        run: |
          python - <<'PY'
          import time
          import requests
          for _ in range(30):
              try:
                  r = requests.get('http://localhost:8001/health', timeout=5)
                  if r.status_code == 200:
                      print('Simulator available')
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit('Pipeline simulator endpoint did not become available')
          PY

      - name: Run unit tests
        run: pytest tests

      - name: Trigger pipeline simulator webhook
        run: |
          curl -sS -X POST http://localhost:8001/simulate \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","dependency":"requests","version":"2.31.0","error":"ReadTimeoutError: HTTPSConnectionPool(host=''pypi.org'', port=443): Read timed out."}'

      - name: Wait for failure solver remediation row
        run: |
          for i in $(seq 1 20); do
            row_count=$(docker exec postgres psql -U resilience_user -d resilience -tAc "SELECT count(*) FROM remediation_actions WHERE action = 'increase_timeout_and_retry' AND status = 'success';" | tr -d '[:space:]')
            if [ "$row_count" != "" ] && [ "$row_count" -ge 1 ]; then
              echo "Timeout remediation row present: $row_count"
              exit 0
            fi
            sleep 3
          done
          echo "No timeout remediation row found in Postgres after webhook trigger" >&2
          exit 1

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v
